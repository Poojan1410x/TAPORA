
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAPORA | Payment</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#090812;color:white;
 font-family:Arial,sans-serif;display:flex;align-items:center;
 justify-content:center;padding:20px
}
.card{
 width:100%;max-width:420px;padding:30px 24px;
 border:1px solid #37304e;border-radius:25px;
 background:linear-gradient(145deg,#191329,#0d0b16);
 text-align:center;box-shadow:0 20px 70px #0008
}
.logo{font-size:30px;font-weight:900;letter-spacing:3px}
.logo span{color:#a78bfa}
.tag{color:#aaa;font-size:13px;margin-top:8px}
h2{margin:35px 0 8px;font-size:23px}
.sub{color:#aaa;font-size:14px}
input{
 width:100%;margin:25px 0 15px;padding:17px;
 border:1px solid #51436f;border-radius:13px;
 background:#100d1b;color:white;font-size:22px;text-align:center;
 outline:none
}
button{
 width:100%;padding:17px;border:0;border-radius:13px;
 background:linear-gradient(90deg,#7c3aed,#a855f7);
 color:white;font-size:16px;font-weight:bold
}
.note{font-size:12px;color:#888;margin-top:22px}
</style>
</head>
<body>
<div class="card">
 <div class="logo">TAP<span>ORA</span></div>
 <div class="tag">ONE TAP. EVERY PAYMENT.</div>
 <h2>Make a Payment</h2>
 <div class="sub">Enter the amount you want to pay</div>
 <input id="amount" type="number" min="1" step="0.01" placeholder="₹ Enter amount">
 <button onclick="pay()">Continue to Pay →</button>
 <div class="note">Secure UPI payment experience<br>Powered by TAPORA</div>
</div>
<script>
function pay(){
 const amount=Number(document.getElementById('amount').value);
 if(!Number.isFinite(amount)||amount<=0){
  alert('Please enter a valid amount');
  return;
 }
 alert('Payment setup is not connected yet. No money has been charged.');
}
</script>
</body>
</html>
