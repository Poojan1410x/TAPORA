
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAPORA Payment</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;min-height:100vh;padding:22px;
 display:grid;place-items:center;
 background:#080611;color:white;
 font-family:Arial,sans-serif;
}

.card{
 position:relative;isolation:isolate;overflow:hidden;
 width:100%;max-width:420px;min-height:650px;
 padding:35px 24px 25px;
 border:1px solid var(--brand);border-radius:26px;
 background:#171024;text-align:center;
 display:flex;flex-direction:column;justify-content:center;
 box-shadow:0 0 35px color-mix(in srgb,var(--brand),transparent 65%);
}

.photoBg{
 position:absolute;inset:0;width:100%;height:100%;
 object-fit:cover;z-index:-2;display:none;
}

.overlay{
 position:absolute;inset:0;z-index:-1;
 background:linear-gradient(to bottom,
 rgba(8,5,20,.48),rgba(8,5,20,.78) 48%,rgba(8,5,20,.96));
}

.business{
 font-size:32px;font-weight:900;
 margin:20px 0 12px;text-shadow:0 2px 12px #000;
}

.tagline{
 color:var(--brand);font-size:13px;
 letter-spacing:3px;font-weight:bold;
}

.muted{color:#ddd;font-size:15px;text-shadow:0 2px 8px #000}
h2{margin-top:45px}

input{
 width:100%;padding:17px;margin:20px 0;
 border:2px solid var(--brand);border-radius:15px;
 background:rgba(12,8,24,.78);color:white;
 font-size:20px;text-align:center;outline:none;
}

input::placeholder{color:#bbb}

button{
 width:100%;padding:17px;border:0;border-radius:15px;
 background:var(--brand);color:white;
 font-weight:bold;font-size:18px;cursor:pointer;
}

button:disabled{opacity:.5;cursor:not-allowed}

#status{
 margin-top:25px;font-size:14px;
 color:#d6baff;text-shadow:0 2px 8px #000;
}

.footer{margin-top:35px;color:#ddd;font-size:13px}
.footer strong{color:var(--brand)}
</style>
</head>

<body>
<div class="card" id="card">
 <img id="photoBg" class="photoBg" alt="Business background">
 <div class="overlay"></div>

 <div class="business" id="business">Loading business...</div>
 <p class="tagline">ONE TAP. EVERY PAYMENT.</p>

 <h2>Enter payment amount</h2>

 <input id="amount" type="number" min="1" step="0.01"
 placeholder="₹ Enter amount" inputmode="decimal">

 <button id="payButton" onclick="startPayment()" disabled>
 Pay with UPI →
 </button>

 <p id="status">Connecting securely...</p>

 <div class="footer">Powered by <strong>TAPORA</strong></div>
</div>

<script>
const SUPABASE_URL =
"https://tmiebdqmygdfdgkvswta.supabase.co";

const SUPABASE_KEY =
"sb_publishable_t3KMHuJVyAJbJtDQV3bLIA_SSjpFGd4";

const slug = new URLSearchParams(location.search)
.get("client") || "poojan";

let client = null;

async function loadClient(){
 try{
  const response = await fetch(
   SUPABASE_URL + "/rest/v1/rpc/get_client_by_slug",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "apikey":SUPABASE_KEY
    },
    body:JSON.stringify({client_slug:slug})
   }
  );

  if(!response.ok) throw new Error("Database error");

  const data = await response.json();
  client = Array.isArray(data) ? data[0] : data;

  if(!client) throw new Error("Client not found");

  const colour = /^#[0-9a-fA-F]{6}$/.test(client.brand_color || "")
   ? client.brand_color : "#8b5cf6";

  document.documentElement.style.setProperty("--brand",colour);
  document.getElementById("business").textContent = client.business_name;

  if(client.logo_url){
   const photo = document.getElementById("photoBg");
   photo.src = client.logo_url;
   photo.style.display = "block";
  }

  document.title = client.business_name + " | TAPORA";
  document.getElementById("status").textContent =
   "Business connected successfully!";
  document.getElementById("payButton").disabled = false;

 }catch(error){
  client = null;
  document.getElementById("business").textContent = "Business unavailable";
  document.getElementById("status").textContent = error.message;
 }
}

function startPayment(){
 const amount = Number(document.getElementById("amount").value);

 if(!client){
  alert("Business is not connected.");
  return;
 }

 if(!Number.isFinite(amount) || amount <= 0){
  alert("Enter a valid amount.");
  return;
 }

 if(!client.upi_id){
  alert("UPI ID is not available.");
  return;
 }

 const params = new URLSearchParams({
  pa:client.upi_id,
  pn:client.business_name,
  am:amount.toFixed(2),
  cu:"INR",
  tn:"TAPORA Payment"
 });

 const upiLink = "upi://pay?" + params.toString();

 document.getElementById("status").textContent =
  "Opening your UPI app...";

 // Keep the same standard UPI intent on both platforms.
 // iOS does not provide a universal way to force FamPay.
 window.location.href = upiLink;
}

loadClient();
</script>
</body>
</html>
