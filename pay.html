
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAPORA Payment</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:20px;
 display:grid;
 place-items:center;
 background:#090812;
 color:white;
 font-family:Arial,sans-serif;
}

.card{
 width:100%;
 max-width:420px;
 padding:30px 24px;
 border:1px solid #39304e;
 border-radius:24px;
 background:linear-gradient(145deg,#191329,#0d0b16);
 text-align:center;
}

.brandLogo{
 max-width:130px;
 max-height:100px;
 object-fit:contain;
 background:white;
 padding:8px;
 border-radius:12px;
 margin-bottom:15px;
}

.businessName{
 font-size:25px;
 font-weight:800;
 margin-top:25px;
}

.muted{color:#aaa;font-size:14px}

h2{margin-top:35px}

input{
 width:100%;
 padding:16px;
 margin:22px 0;
 border:1px solid var(--brand);
 border-radius:12px;
 background:#100d1b;
 color:white;
 font-size:20px;
 text-align:center;
}

button{
 width:100%;
 padding:16px;
 border:0;
 border-radius:12px;
 background:var(--brand);
 color:white;
 font-weight:bold;
 font-size:16px;
}

#status{
 margin-top:22px;
 font-size:14px;
 color:#c4b5fd;
}

.footer{
 margin-top:30px;
 font-size:11px;
 color:#777;
}
</style>
</head>

<body>

<div class="card">

 <div id="logoArea">
  <div class="businessName">TAPORA</div>
 </div>

 <p class="muted">ONE TAP. EVERY PAYMENT.</p>

 <h2 id="business">Loading business...</h2>

 <p class="muted">Enter payment amount</p>

 <input
  id="amount"
  type="number"
  min="1"
  step="0.01"
  placeholder="₹ Enter amount"
 >

 <button id="continueBtn" onclick="testPayment()">
  Continue
 </button>

 <p id="status">Connecting securely...</p>

 <div class="footer">Powered by TAPORA</div>

</div>

<script>
const SUPABASE_URL =
"https://tmiebdqmygdfdgkvswta.supabase.co";

const SUPABASE_KEY =
"sb_publishable_t3KMHuJVyAJbJtDQV3bLIA_SSjpFGd4";

const slug = new URLSearchParams(location.search)
.get("client") || "poojan";

let client = null;

async function loadClient(){

 try{

  const response = await fetch(
   SUPABASE_URL + "/rest/v1/rpc/get_client_by_slug",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "apikey":SUPABASE_KEY
    },
    body:JSON.stringify({
     client_slug:slug
    })
   }
  );

  if(!response.ok){
   throw new Error("Database error");
  }

  const data = await response.json();

  client = Array.isArray(data) ? data[0] : data;

  if(!client){
   throw new Error("Client not found");
  }

  const colour = /^#[0-9a-fA-F]{6}$/.test(client.brand_color || "")
   ? client.brand_color
   : "#8b5cf6";

  document.documentElement.style.setProperty(
   "--brand",colour
  );

  document.getElementById("business").textContent =
   client.business_name;

  if(client.logo_url){

   const img = document.createElement("img");

   img.src = client.logo_url;
   img.alt = client.business_name + " logo";
   img.className = "brandLogo";

   document.getElementById("logoArea").replaceChildren(img);

   img.onerror = ()=>{
    document.getElementById("logoArea").textContent =
     client.business_name;
   };
  }else{
   document.getElementById("logoArea").textContent =
    client.business_name;
  }

  document.title = client.business_name + " | TAPORA";

  document.getElementById("status").textContent =
   "Business connected successfully!";

 }catch(error){

  client = null;

  document.getElementById("business").textContent =
   "Business unavailable";

  document.getElementById("status").textContent =
   error.message;

 }
}

function testPayment(){

 const amount = Number(
  document.getElementById("amount").value
 );

 if(!client){
  alert("Business is not connected yet.");
  return;
 }

 if(!Number.isFinite(amount) || amount <= 0){
  alert("Enter a valid amount.");
  return;
 }

 document.getElementById("status").textContent =
  "Test successful! UPI payment is not enabled yet.";

}

loadClient();
</script>

</body>
</html>
